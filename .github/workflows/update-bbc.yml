# BBC 的排程入口；實際安裝、收集與發布交給共用 scrape.yml。
name: Update BBC Trends

on:
    # cron 使用 UTC；分鐘數沿用既有設定，實際啟動時間可能因平台排隊而延遲。
    schedule:
        - cron: '15,45 * * * *'
    # 允許在 Actions 手動啟動，並選擇只驗證、不發布的試跑模式。
    workflow_dispatch:
        inputs:
            dry_run:
                description: Validate without publishing data
                type: boolean
                default: false

permissions:
    contents: write

# 同來源避免並行執行；不取消已在執行的工作，不同來源仍可並行。
concurrency:
    group: scrape-bbc
    cancel-in-progress: false

jobs:
    # 傳入固定來源名稱，避免在各排程重複維護相同的收集步驟。
    update:
        uses: ./.github/workflows/scrape.yml
        with:
            source: bbc
            dry_run: ${{ inputs.dry_run || false }}
